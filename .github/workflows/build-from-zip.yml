name: Build ReyGameTurbo RGT from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e
          mapfile -t zips < <(find . -maxdepth 1 -type f -iname "*.zip" -print)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one project ZIP in repository root."
            printf '%s\n' "${zips[@]}"
            exit 1
          fi
          echo "path=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract
        run: |
          rm -rf project
          mkdir project
          unzip -q "${{ steps.zip.outputs.path }}" -d project

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -e
          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS"
          DIR="$(dirname "$SETTINGS")"
          test -f "$DIR/build.gradle" || test -f "$DIR/build.gradle.kts"
          test -d "$DIR/app"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReyGameTurbo-RGT-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
